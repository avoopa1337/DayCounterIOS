workflows:
  ios-unsigned-ipa:
    name: Build Unsigned iOS IPA
    max_build_duration: 30
    instance_type: mac_mini_m2
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode Project
        script: xcodegen generate
      - name: Build App & Widget
        script: |
          xcodebuild \
            -project DayCounter.xcodeproj \
            -scheme DayCounterApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Package IPA
        script: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/DayCounterApp.app Payload/
          zip -r DayCounter.ipa Payload
    artifacts:
      - DayCounter.ipa
