name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App & Widget
        run: |
          xcodebuild \
            -project DayCounter.xcodeproj \
            -scheme DayCounterApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/DayCounterApp.app Payload/
          zip -r DayCounter.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DayCounter-IPA
          path: DayCounter.ipa
