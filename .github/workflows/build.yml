name: DayCounter
options:
  bundleIdPrefix: com.personal.daycounter
targets:
  DayCounterApp:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.daycounter.app
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGNING_ALLOWED: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
    dependencies:
      - target: DaysWidgetExtension
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.personal.daycounter.shared

  DaysWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Widget
      - path: App/SharedModels.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.daycounter.app.widget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGNING_ALLOWED: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.personal.daycounter.shared
